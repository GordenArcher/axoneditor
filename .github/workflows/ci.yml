name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# This workflow only reads the repository and produces an ephemeral build.
# Keeping the token read-only prevents a dependency or build script from
# modifying source, releases, or repository settings if it is compromised.
permissions:
  contents: read

# A newer commit on the same branch supersedes an older build. Cancelling the
# stale run keeps pull-request feedback fast without suppressing builds from
# other branches, because the workflow name and Git ref form the group key.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci installs the exact dependency graph recorded in package-lock.json.
      # That makes the CI build reproducible and fails immediately if package.json
      # and the lockfile drift apart instead of silently rewriting dependencies.
      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build
